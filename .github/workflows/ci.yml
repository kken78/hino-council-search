name: ci
# PR・push のたびに、解析器のテスト・審議構造の精度チェック・MCP の構文・本番ビルドを確認する。
# 外部パッケージ不要（Node 標準のみ）。文字の大きさの実寸の検査だけ、Playwright を作業用の場所に入れる（package.json は増やさない）。
# あわせて、hino-portal の shared/ の文字の大きさの検査（静的検査と、幅 360px と 1024px での実寸）を走らせる。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: 解析器の回帰テスト
        run: npm test
      - name: 審議構造の精度レポート
        run: node scripts/check-proceedings.mjs
      - name: 統合MCPサーバーの構文チェック
        run: node --check mcp/hino-council-mcp.mjs
      - name: 本番ビルド（dist/online・オフラインHTML）
        run: node scripts/build.mjs

      # 議会の画面の見方（hino-portal DESIGN.md 9.1）。共通の部品を写していないので --gikai で検査する
      # （文字の大きさ・位置づけの一文・ポータルへの戻りのリンク・新しいタブの知らせ・ダッシュ・絵文字など）。
      - name: 議会の画面の表記（hino-portal の shared/check.py --gikai）
        run: |
          git clone --depth 1 https://github.com/kken78/hino-portal.git /tmp/hino-portal
          python3 /tmp/hino-portal/shared/check.py --gikai dist/online/index.html dist/*.html

      # 実寸の検査はデータを埋め込んだオフライン版で行う（オンライン版は file:// ではデータを読み込めない）
      - name: 実ブラウザでの文字の大きさと横のはみ出し（hino-portal の shared/check_mobile.mjs）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs node /tmp/hino-portal/shared/check_mobile.mjs dist/*.html

      # 会議録検索に固有の検査：手元版が外のサイトへ通信しないこと、決まった言葉で決まった発言が出ること、
      # 共有リンクでその発言が開くこと、議会だよりダッシュボードのリンクの発言が索引にあること
      - name: 会議録検索の動き（scripts/check-ui.mjs）
        run: PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs node scripts/check-ui.mjs --council https://raw.githubusercontent.com/kken78/council-dashboard/main/docs/data/questions.json
